<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>트렌드라이다 · 자동 랭킹</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#E9E7E1;--surface:#FBFAF7;--surface-2:#F1EFE9;--ink:#18181B;--muted:#6E6B63;--faint:#98948A;--line:#DCD9D1;--accent:#1F3BFF;--accent-ink:#1631D6;--accent-soft:rgba(31,59,255,.09);--rose:#C21C86;--rose-soft:rgba(194,28,134,.1);--up:#0E9F6E;--shadow:0 1px 2px rgba(30,25,15,.05),0 8px 24px rgba(30,25,15,.06)}
  @media (prefers-color-scheme:dark){:root{--bg:#101114;--surface:#191A1E;--surface-2:#202127;--ink:#F1F0EC;--muted:#9B978D;--faint:#726E65;--line:#2A2C32;--accent:#7E93FF;--accent-ink:#9DACFF;--accent-soft:rgba(126,147,255,.14);--rose:#F472C0;--rose-soft:rgba(244,114,192,.14);--up:#34D399;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .htop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:20px 0 14px}
  .brand .kr{font-size:25px;font-weight:800;letter-spacing:-.02em}.brand .kr b{color:var(--accent)}
  .brand .en{font-size:10px;font-weight:700;letter-spacing:.32em;color:var(--faint);text-transform:uppercase}
  .meta{text-align:right;font-size:12px;color:var(--muted)}.meta b{color:var(--ink)}
  .tabs{display:flex;gap:6px;padding:2px 0 12px;overflow-x:auto}
  .tab{white-space:nowrap;font-size:13px;font-weight:700;padding:8px 15px;border-radius:999px;border:1px solid transparent;color:var(--muted);cursor:pointer;background:none}
  .tab.on{color:#fff;background:var(--accent)}.tab:not(.on):hover{background:var(--surface-2)}
  .tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-left:6px}
  .tab .dot.bad{background:#E5484D}
  section{padding:24px 0}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 4px}
  h2{font-size:19px;font-weight:800;margin:0 0 4px}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 16px}
  .chips{margin:0 0 16px}
  .chip{display:inline-flex;gap:6px;align-items:baseline;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);margin:0 7px 7px 0}
  .chip .n{font-weight:800;color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-2px);transition:transform .15s}
  .thumb{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--surface-2);display:block}
  .cbody{padding:9px 11px 11px}
  .crank{font-size:12px;font-weight:800;color:var(--accent)}.crank.t3{color:var(--rose)}
  .cbrand{font-size:11px;font-weight:700;color:var(--accent-ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cname{font-size:12px;color:var(--ink);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ccat{font-size:9.5px;font-weight:800;color:var(--accent-ink);background:var(--accent-soft);padding:1px 5px;border-radius:4px;display:inline-block;margin-top:5px}
  .err{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid #E5484D;border-radius:10px;padding:14px;font-size:13px;color:var(--muted)}
  footer{padding:24px 0 40px;text-align:center;color:var(--faint);font-size:12px}
  @media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="htop">
    <div class="brand"><div class="kr">트렌드<b>라이다</b></div><div class="en">Auto Ranking · Mardi</div></div>
    <div class="meta"><b>여성 패션 랭킹</b><br><span id="gen">불러오는 중…</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div></header>

<main class="wrap">
  <section id="panel">
    <div class="err" id="loading">데이터를 불러오는 중입니다…</div>
  </section>
</main>
<footer>트렌드라이다 자동 스크래퍼 · GitHub Actions로 매일 갱신 · 랭킹/이미지는 각 플랫폼에서 자동 수집</footer>

<script>
const $ = s => document.querySelector(s);
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function brandChips(items){
  const cnt={};items.forEach(i=>{if(i.brand)cnt[i.brand]=(cnt[i.brand]||0)+1;});
  const top=Object.entries(cnt).filter(([,n])=>n>1).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(!top.length)return '';
  return '<div class="chips"><span style="font-size:12px;color:var(--muted);font-weight:700;margin-right:8px">🏷️ 다빈도 브랜드</span>'+
    top.map(([b,n])=>'<span class="chip">'+esc(b)+' <span class="n">'+n+'</span></span>').join('')+'</div>';
}

function renderPanel(key, p){
  const panel=$('#panel');
  if(!p || !p.ok || !p.items.length){
    panel.innerHTML='<p class="eyebrow">'+esc(p?p.label:key)+'</p><div class="err"><b>수집 실패 또는 데이터 없음.</b> '+esc(p&&p.error||'')+'<br>사이트 구조 변경 시 스크래퍼 셀렉터 조정이 필요할 수 있어요.</div>';
    return;
  }
  const cards=p.items.map(it=>{
    const cat=it.cat?'<span class="ccat">'+esc(it.cat)+'</span>':'';
    const img=it.img?'<img class="thumb" loading="lazy" src="'+esc(it.img)+'" alt="">':'<div class="thumb"></div>';
    return '<a class="card" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+img+
      '<div class="cbody"><div class="crank'+(it.rank<=3?' t3':'')+' mono">'+it.rank+'위</div>'+
      '<div class="cbrand">'+esc(it.brand)+'</div><div class="cname">'+esc(it.name)+'</div>'+cat+'</div></a>';
  }).join('');
  panel.innerHTML='<p class="eyebrow">'+esc(p.label)+' · 여성 랭킹</p><h2>'+esc(p.label)+' TOP'+p.items.length+'</h2>'+
    '<p class="sub">클릭하면 상품 페이지로 이동합니다.</p>'+brandChips(p.items)+'<div class="grid">'+cards+'</div>';
}

fetch('./data.json?_='+Date.now()).then(r=>r.json()).then(data=>{
  $('#gen').innerHTML='업데이트: '+esc(data.generatedAtKST||data.generatedAt);
  const keys=Object.keys(data.platforms);
  const tabs=$('#tabs');
  tabs.innerHTML=keys.map((k,i)=>{const p=data.platforms[k];return '<button class="tab'+(i===0?' on':'')+'" data-k="'+k+'">'+esc(p.label)+'<span class="dot'+(p.ok?'':' bad')+'"></span></button>';}).join('');
  function select(k){[].forEach.call(tabs.children,b=>b.classList.toggle('on',b.dataset.k===k));renderPanel(k,data.platforms[k]);}
  tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)select(b.dataset.k);});
  select(keys[0]);
}).catch(e=>{$('#loading').innerHTML='data.json 을 불러오지 못했습니다: '+esc(String(e));});
</script>
</body>
</html>
